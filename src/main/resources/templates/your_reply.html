<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>给你的回复</title>
</head>
<body style="margin: 0; padding: 0; background: linear-gradient(135deg, #6a11cb, #2575fc); font-family: Arial, sans-serif;">
    <!-- 外层居中表格 -->
    <table width="100%" cellpadding="20" cellspacing="0" border="0">
        <tr>
            <td align="center" style="padding: 20px;">
                <!-- 卡片容器 -->
                <table width="460" cellpadding="0" cellspacing="0" border="0" style="background: #ffffff; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); overflow: hidden;">
                    <!-- 卡片头部 -->
                    <tr>
                        <td style="height: 150px; background: linear-gradient(45deg, #ff9a9e, #fad0c4); position: relative; padding: 0; text-align: center;">
                            <!-- 装饰圆点 -->
                            <div style="position: relative; height: 150px;">
                                <span style="position: absolute; top: 30px; left: 40px; width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.3);"></span>
                                <span style="position: absolute; top: 80px; right: 60px; width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.3);"></span>
                                <span style="position: absolute; bottom: 40px; left: 80px; width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.3);"></span>
                                <!-- 心形 -->
                                <span style="position: absolute; top: 70px; left: 165px; width: 30px; height: 30px; background: #ff6b6b; transform: rotate(45deg);"></span>
                                <span style="position: absolute; top: 55px; left: 165px; width: 30px; height: 30px; background: #ff6b6b; border-radius: 50%;"></span>
                                <span style="position: absolute; top: 70px; left: 150px; width: 30px; height: 30px; background: #ff6b6b; border-radius: 50%;"></span>
                            </div>
                        </td>
                    </tr>
                    <!-- 卡片正文 -->
                    <tr>
                        <td style="padding: 40px; text-align: center;">
                            <h1 style="font-size: 28px; color: #333; margin-bottom: 20px; font-weight: bold;" th:inline="text">[[${from}]]给你的回复</h1>
                            <p style="font-size: 16px; color: #555; line-height: 1.8; margin-bottom: 30px; text-align: left;" th:text="${message}">
                                
                            </p>
                            <div style="font-size: 20px; color: #6a11cb; font-style: italic; text-align: right; border-bottom: 2px dotted #eee; padding-right: 20px; margin-top: 20px;">
                                —— 致最特别的你
                            </div>
                            <div style="text-align: right; margin-top: 10px; font-size: 24px;">🌸</div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
