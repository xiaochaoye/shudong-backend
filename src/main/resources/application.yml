# 应用服务 WEB 访问端口
server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: shudong-backend
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 20MB         # 单个文件最大 10MB
      max-request-size: 100MB     # 一次请求（多个文件）总大小上限 (maybe以后要用)
      enabled: true               
  mail:
    host: smtp.163.com
    port: 465
    # username: 邮件地址
    # password: 授权码（之前的授权码已作废）
    protocol: smtp
    default-encoding: UTF-8
    properties:
      timeout: 5000
      connection-timeout: 5000
      write-timeout: 5000
      mail:
        smtp:
          socketFactoryClass: javax.net.ssl.SSLSocketFactory
          debug: true
          auth: true
          # starttls:
          #   enable: true
          ssl:
            enable: true
            trust: smtp.163.com
  redis:
    host: localhost
    port: 6379
    database: 0
    password: 123456  # 没有密码就注释掉这行
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/shudong?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456  
  jackson:
    time-zone: Asia/Shanghai  

springdoc:
  api-docs:
    enabled: true
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.shudong.controller
knife4j:
  enable: true
  setting:
    language: zh_cn
  openapi:
    enable: true

# JWT配置
jwt:
  secret: k3b7+9Xq2J8pZ1vT6wN5mR4sA0oL9nE7dH2cV8xQ1aP=
  expiration: 86400000  # 默认24小时（毫秒）
  header: Authorization
  prefix: Bearer

# Spring Security配置
security:
  cors:
    allowed-origins: "*"
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
  public-endpoints:               # 添加接口前去掉 "/api"
    - "/auth/**"                  # 认证相关接口
    - "/users/**"                 # 用户相关接口
    - "/users/register/**"        # 用户注册相关接口
    - "/users/login"              # 用户登录接口
    - "/users/forgot-password/**" # 忘记密码相关接口
    - "/posts/public/**"          # 公开帖子接口
    - "/comments/public/**"       # 公开评论接口
    - "/doc.html"                 # Knife4j文档
    - "/webjars/**"               # Knife4j静态资源
    - "/v3/api-docs/**"           # OpenAPI文档
    - "/favicon.ico"              # 网站图标          
    - "/error"                    # 错误页面
    - "/email/**"                 # 发送安慰邮件接口（后面需弃用）
    - "/wishes/stats"             # 许愿池统计信息（总数、已实现数量、未实现数量）
  admin-endpoints:
    - "/admin/**"

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

cos:
  client:
    # accessKey: 你的accessKey
    # secretKey: 你的secretKey
    # region: 你的区域
    # bucket: 桶名称
    # cosHost: https://xxxx.myqcloud.com
    # expireTime: 3600000