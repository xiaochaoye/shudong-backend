springdoc:
  api-docs:
    enabled: true
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.chao.shudongbackend.controller
knife4j:
  enable: true
  setting:
    language: zh_cn
  openapi:
    enable: true

# JWT配置
jwt:
  secret: shudong-backend-secret-key-2025
  expiration: 86400000  # 默认24小时（毫秒）
  header: Authorization
  prefix: Bearer

# Spring Security配置
security:
  cors:
    allowed-origins: "*"
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
  public-endpoints:
    - "/auth/**"
    - "/users/register"
    - "/users/login"
    - "/posts/public/**"
    - "/comments/public/**"
    - "/doc.html"
    - "/webjars/**"
    - "/v3/api-docs/**"
    - "/favicon.ico"
    - "/error"
  admin-endpoints:
    - "/admin/**"


